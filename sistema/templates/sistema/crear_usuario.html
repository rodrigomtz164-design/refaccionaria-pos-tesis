{% extends 'sistema/base.html' %}

{% block title %}Crear Usuario - POS Refaccionaria{% endblock %}

{% block content %}
<div class="container-fluid py-2" style="max-width: 900px;">
    <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
            <h2 class="h3 fw-bold mb-0 text-dark">
                <i class="fa-solid fa-user-plus text-primary me-2"></i>Registrar Nuevo Usuario
            </h2>
            <p class="text-muted mb-0">Crea credenciales y asigna un rol en el sistema.</p>
        </div>
        <a href="{% url 'lista_usuarios' %}" class="btn btn-outline-secondary">
            <i class="fa-solid fa-arrow-left me-1"></i> Volver a la Lista
        </a>
    </div>

    {% if error %}
    <div class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="fa-solid fa-circle-exclamation me-2"></i>{{ error }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {% endif %}

    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <form method="post">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Nombre de Usuario (Username) *</label>
                        <input type="text" name="username" class="form-control" placeholder="ej. jdoe" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">Contraseña *</label>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">Nombre(s)</label>
                        <input type="text" name="first_name" class="form-control" placeholder="Juan">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">Apellido(s)</label>
                        <input type="text" name="last_name" class="form-control" placeholder="Pérez">
                    </div>

                    <div class="col-md-12">
                        <label class="form-label fw-bold">Rol en el Sistema *</label>
                        <select name="rol_id" class="form-select" required>
                            <option value="" disabled selected>Selecciona un rol...</option>
                            {% for rol in roles %}
                                <option value="{{ rol.id }}">{{ rol.nombre }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <hr class="my-4">

                <div class="d-flex justify-content-end gap-2">
                    <a href="{% url 'lista_usuarios' %}" class="btn btn-light border">Cancelar</a>
                    <button type="submit" class="btn btn-primary px-4 fw-bold">
                        <i class="fa-solid fa-floppy-disk me-1"></i> Guardar Usuario
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
