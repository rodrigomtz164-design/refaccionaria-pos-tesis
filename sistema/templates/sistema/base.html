<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}POS Refaccionaria{% endblock %}</title>
    
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-light">

    <!-- Navbar Principal -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="{% url 'dashboard' %}">
                <i class="fa-solid fa-gears text-warning"></i> Refaccionaria POS
            </a>
            
            {% if user.is_authenticated %}
            <div class="d-flex align-items-center text-white">
                <span class="me-3">
                    <i class="fa-solid fa-user-circle"></i> 
                    {{ user.username }} 
                    <span class="badge bg-secondary ms-1">
                        {% if user.rol %}{{ user.rol.nombre }}{% else %}Superusuario{% endif %}
                    </span>
                </span>
                
                <form action="{% url 'logout' %}" method="post" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-danger btn-sm">
                        <i class="fa-solid fa-right-from-bracket"></i> Salir
                    </button>
                </form>
            </div>
            {% endif %}
        </div>
    </nav>

    <!-- Contenido Principal -->
    <main class="container-fluid px-4">
        {% block content %}
        <!-- Aquí se inyectará el contenido de las otras vistas -->
        {% endblock %}
    </main>

    <!-- Bootstrap 5 JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
